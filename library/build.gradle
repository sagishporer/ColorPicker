plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

android {
    namespace 'com.jaredrummler.android.colorpicker'
    compileSdk libs.versions.compileSdk.get().toInteger()
    resourcePrefix "cpv_"
    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.preference
    testImplementation libs.junit
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                artifact("$buildDir/outputs/aar/${project.name}-release.aar"){
                    builtBy assembleRelease
                }

                groupId = 'com.github.sagishporer'
                artifactId = 'color-picker-android'

                pom {
                    name = 'Color Picker'
                    description = 'A highly customizable color picker for Android'
                    url = 'https://github.com/sagishporer/color-picker-android'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }
    }
}
